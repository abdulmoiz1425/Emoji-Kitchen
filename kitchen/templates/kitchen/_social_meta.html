{% load static %}
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Emoji Kitchen Hub" />
<meta property="og:title" content="{{ page_title }}" />
<meta property="og:description" content="{{ page_description }}" />
<meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}" />
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'kitchen/img/favicon.svg' %}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page_title }}" />
<meta name="twitter:description" content="{{ page_description }}" />
<meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'kitchen/img/favicon.svg' %}" />
