{% extends 'kitchen/base.html' %}

{% block title %}Page not found — Emoji Kitchen{% endblock %}
{% block meta_description %}That page is not on Emoji Kitchen Hub.{% endblock %}

{% block content %}
<section class="section">
  <div class="container container--narrow">
    <div class="section-head animate-up">
      <span class="section-badge">404</span>
      <h1>Page not found</h1>
      <p>That address is not on this site.</p>
    </div>
    <p class="animate-up" style="--delay:.08s"><a href="{% url 'home' %}">Back to the homepage</a></p>
  </div>
</section>
{% endblock %}
